name: t_pdf_reader_example
description: "Demonstrates how to use the t_pdf_reader plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter

  t_pdf_reader:
    path: ../

  cupertino_icons: ^2.0.0

  t_widgets: ^2.6.1
  than_pkg: ^6.0.0
  desktop_drop: ^0.8.4
  dart_core_extensions: ^0.7.0
  pdfium_dart: ^0.4.0
  than_pdf_engine: ^1.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
